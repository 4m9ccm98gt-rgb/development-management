# Python/Windows アプリの標準設定（テンプレート）。
# <...> を対象アプリの実値へ置き換える。秘密情報・配布先の実パスは書かない。

[project]
name = "<app-name>"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  # 例: "PySide6>=6.8,<7"
]

[tool.devstandards]
# アプリ種別。check_standards.py がこの値で必要経路を切り替える。
#   desktop … 起動 + EXEビルド + 配布更新
#   web     … 起動 + デプロイ
#   service … 起動 + 常駐登録
#   lib     … 部品。ワンクリック経路は不要
type = "desktop"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
