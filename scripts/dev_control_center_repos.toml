[branches]
beverage-inventory-ordering-system = "main"
call-reception-assistant = "main"
development-management = "main"
food-cost-calculation-system = "main"
inventory-reconciliation-system = "main"
menu-sheet-generator = "main"
next-day-setup = "main"
qr-supply-ordering-system = "main"
shizen-launcher = "main"

# Keep the app visible; RUN remains MISSING until the application is implemented.
# Remove this entry when implementation and distribution become applicable.
[unimplemented]
call-reception-assistant = "Application source is not implemented; SYNC-only setup approved."

# First AI request / independent test command shown in the DCC AI fields when a repo
# is selected and the user has not typed anything yet.
[initial_ai_tasks]
development-management = """development-managementの変更依頼です。
変更内容・優先順位・受入条件をここへ具体的に書いてください。
OPERATING_CONTRACT.mdを正本とし、関連する自動テストも追加・更新してください。"""
shizen-launcher = """PySide6のデモアプリを新規に作成してください。
ウィンドウにタイトルとボタンを1つ表示し、ボタンを押すとラベルが更新される最小構成にしてください。
RUN_DEV.cmd（.venvを作成しrequirements.txtからPySide6を導入して起動）とrequirements.txt、README.md、
ヘッドレスで実行できる最小のテストを追加してください。
BUILD / UPDATEの入口はこの依頼では作成せず、秘密情報・実運用データは含めないでください。"""

# Default independent Tests command per repo, filled into the Orchestrator Tests field (editable there).
# Takes precedence over DCC's guessed command. Written as a POSIX-shell command line; on Windows
# the Orchestrator keeps its meaning under cmd.exe ('...' quoting is converted).
# `python` resolves to the source repo's git-ignored `.venv` when it exists (cwd stays the worktree).
[initial_tests]
development-management = "python -m unittest discover -s tests -v"
next-day-setup = "python -m pytest -q"
shizen-launcher = "python -m unittest discover -s tests -v"

# DCC RUN (non-interactive body of each repo's RUN_DEV.cmd). One table per repo:
#   cwd    folder of the repo to run in (relative; the RUN target is the source repo, or the
#          candidate worktree for an Orchestrator candidate — resolved against that target)
#   entry  script path relative to cwd, or `module` for `python -m <module>`
#   probe  import check before start; env: extra variables, values relative to the target when
#          they name a path (PYTHONPATH). The repo's `.venv` Python is used.
#   seed   candidate RUN_DEV only: git-ignored runtime data (settings / saved data) copied one way
#          from the source repo into the candidate worktree before every RUN_DEV. Never copied back;
#          each path must be ignored in the source and untracked in the candidate.
# A repo's own dcc_entrypoints.json still takes precedence.
# A registered repo without RUN_DEV.cmd still gets a READY RUN entry (this body is what DCC runs).
[run.next-day-setup]
cwd = "."
entry = "dinner_system/hotel_app_entry.py"  # v1.4.1+: production entry (extends hotel_app.HotelApp)
probe = "import openpyxl; import reportlab; import PIL"
seed = [
    "dinner_system/master_settings.json",
    "dinner_system/ui_prefs.json",
    "dinner_system/closing_tasks.json",
    "dinner_system/monthly_tasks.json",
    "dinner_system/config/print_preparation.json",
    "dinner_system/保存データ",
]

# DCC BUILD body of repos whose manual BUILD CMD only wraps one Python script (the CMD and its `pause`
# are never run by DCC). build_info: the file the build writes into the artifact with the commit it was
# built from; DCC accepts the BUILD only when that SHA equals the built HEAD (and the candidate).
[build.next-day-setup]
cwd = "."
script = "build_exe.py"
build_info = { file = "BUILD_INFO.txt", sha_key = "Git commit SHA", tree_key = "Git working tree" }

# DCC release settings: the common UPDATE engine (release_update) and the restore tool (restore_release).
# The engine is common; a repo only declares what belongs to it (docs/dev_control_center.md「共通UPDATE engine」).
#   engine = "dcc"   DCC's UPDATE button uses the common engine (dry-run -> confirm -> execute) for this repo
#   artifact / child_target   BUILD output folder / sub-folder of a chosen target that holds the app
#   managed          files the release owns (segment-aware globs: `*` one level, `**` any depth); everything
#                    else in the target is unmanaged and never written
#   protected / protected_names   operational data never written (checked when planning and in every write),
#                    excluded from `managed` even when a pattern matches
#   critical         SHA-256 before/after; other operational data: path / presence / size / mtime
#   operational_roots   the only folders searched for protected data (plus the top-level files)
#   final_swap       replaced after everything else, in this order (the EXE last); commit_file: restore's last file
#   in_use           must not be open on any PC (exclusive open); held closed until the final swap
#   manifest         DCC release manifest v2 in the target (written only after a verified UPDATE)
#   lock / legacy_locks   the common lock plus the legacy PowerShell updater's lock (all FileShare none)
#   backup_dir / backup_retention   changed-only backups (`dcc_release_*`) kept per repo; other backups untouched
#   records / deploy_manifest / retain   legacy updater files (restore of full backups only)
[release.next-day-setup]
engine = "dcc"
artifact = "dist/DinnerSystem"
child_target = "DinnerSystem"
managed = ["DinnerSystem.exe", "_internal/**", "*.txt", "*.bat", "*.vbs"]
final_swap = ["BUILD_INFO.txt", "DinnerSystem.exe"]
commit_file = "DinnerSystem.exe"
in_use = ["DinnerSystem.exe"]
records = ["DinnerSystem.exe.previous", "DEPLOY_MANIFEST.json"]
build_info = "BUILD_INFO.txt"
deploy_manifest = "DEPLOY_MANIFEST.json"
manifest = "DCC_RELEASE_MANIFEST.json"
lock = ".dcc-release.lock"
legacy_locks = [".nds-update.lock"]
backup_dir = "backup"
backup_retention = 5
# update_shared_folder.ps1 / update_delta.ps1 protection, plus the app's own print settings (config/, written
# by the running app via app_dir()/config) and outputs/ at the top level, which no updater ever deployed.
protected = [
    "保存データ/*", "*/保存データ/*",
    "print_work/*", "*/print_work/*",
    "logs/*", "*/logs/*", "log/*", "*/log/*", "*.log",
    "backup/*", "*/backup/*",
    "_internal/outputs/*",
    "_internal/tools/SumatraPDF-settings.txt",
    "config/*",
    "outputs/*",
]
protected_names = ["closing_tasks.json", "master_settings.json", "ui_prefs.json"]
critical = ["closing_tasks.json", "master_settings.json", "ui_prefs.json"]
operational_roots = ["_internal", "保存データ", "print_work", "logs", "log"]
retain = ["README.txt"]

[run.food-cost-calculation-system]
cwd = "."
module = "food_cost_app.main"
probe = "import PySide6; import cv2; import PIL; import pytesseract; import flask; import qrcode"
env = { PYTHONPATH = "src" }

[run.inventory-reconciliation-system]
cwd = "."
entry = "room_inventory_reconcile.py"
probe = "import openpyxl"

[run.qr-supply-ordering-system]
cwd = "."
entry = "run.py"
probe = "import flask"

[run.beverage-inventory-ordering-system]
cwd = "python_app"
entry = "app.py"
probe = "import PySide6; assert PySide6.__version__.startswith('6.8.')"

# No GUI and no RUN_DEV.cmd: RUN is the test suite (exit code 0 = PASS). The tests import their
# helper as a top-level `support` module, so tests/ goes on PYTHONPATH.
[run.shizen-launcher]
cwd = "."
module = "unittest"
env = { PYTHONPATH = "tests" }
