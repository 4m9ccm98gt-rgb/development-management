# アプリ種別の暫定マップ。
#
# 本来は各リポジトリの pyproject.toml に
#   [tool.devstandards]
#   type = "desktop"   # desktop | web | service | lib
# を置く。それが入るまでの間、check_standards.py はこの表を使う。
# ここに無いリポジトリは依存関係から自動判定し、判定できなければ
# 「種別未設定」の警告を出す。
#
# 確度の高いものだけ記載する。不確かなものは自動判定に委ねる。

[types]
beverage-inventory-ordering-system = "desktop"  # PySide6。3経路の実績元
food-cost-calculation-system       = "desktop"  # 俺伝。EXEビルド + HDD配布
next-day-setup                     = "desktop"  # BUILD_EXE_CLICK_ME + UPDATE_SHARED_FOLDER
inventory-reconciliation-system    = "service"  # 自動実行の実運用中
qr-supply-ordering-system          = "web"      # Flask系の独立Webアプリ
call-reception-assistant           = "desktop"  # PCのマイク・スピーカーで完結する試作

# 要確認（自動判定に委ねる）:
#   menu-sheet-generator  … 帳票生成 + 共有フォルダ配布。desktop か service か未確認
#   kitchen-calendar      … Python + 起動バッチあり。種別未確認
